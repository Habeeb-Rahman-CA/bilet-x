name: Custom Issue
description: Open an issue that doesn't fit the bug or feature templates
title: "[Issue]: "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for questions, documentation problems, discussions, or anything that isn't a bug report or feature request.
  - type: dropdown
    id: category
    attributes:
      label: Issue category
      options:
        - Question
        - Documentation
        - Discussion / RFC
        - Refactor / Tech debt
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short summary of the issue or topic.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Provide as much context as possible — links, code snippets, references.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a good resolution or outcome look like?
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else worth mentioning.
